<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jay Clinic — clínica de micropigmentação e estética avançada em Campinas</title>
  <meta name="description" content="A clínica de James Olaya em Campinas: micropigmentação de sobrancelhas e lábios, estética avançada e uma estrutura pensada para o seu atendimento." />
  <!-- ⚠️ Fora do Google enquanto está em construção. Tirar o noindex é o
       último passo antes de publicar — página pela metade indexada é pior que
       página nenhuma. -->
  <meta name="robots" content="noindex, nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* ============================================================
       SISTEMA — o mesmo da /academy e da /jamesolaya.
       Não é cópia por preguiça: as três páginas são da mesma casa, e quem
       vem de uma pra outra tem que sentir que continua no mesmo lugar.
       ============================================================ */
    :root {
      --ouro: #AC9751;
      --ouro-claro: #DCC383;
      --preto: #101820;
      --off-white: #F8F7F2;
      --fundo: #070605;
      --painel: #0E0C0A;
      --linha: rgba(172, 151, 81, .22);
      --texto-fraco: rgba(248, 247, 242, .70);
    }

    html { scroll-behavior: smooth; }
    body {
      background: var(--fundo);
      color: var(--off-white);
      font-family: 'Poppins', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .faixa { width: 90%; max-width: 1440px; margin: 0 auto; }

    /* O intervalo entre dobras separa, não esvazia. ~100px em tela cheia. */
    .secao { padding: clamp(58px, 6.8vw, 104px) 0; position: relative; }

    /* Filete dourado entre dobras irmãs — o respiro de revista. Nunca logo
       abaixo da abertura. */
    .secao + .secao::before {
      content: '';
      position: absolute;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 1440px;
      height: 1px;
      background: linear-gradient(to right, rgba(172,151,81,0), rgba(172,151,81,.28) 18%, rgba(172,151,81,.28) 82%, rgba(172,151,81,0));
    }

    .btn {
      display: inline-block;
      text-decoration: none;
      font-size: clamp(10.5px, .78vw, 12px);
      font-weight: 500;
      letter-spacing: .24em;
      text-transform: uppercase;
      padding: 16px clamp(26px, 2.4vw, 40px);
      border-radius: 999px;
      transition: transform .2s ease, box-shadow .2s ease, background .2s ease, border-color .2s ease;
    }
    .btn--ouro {
      background: linear-gradient(120deg, var(--ouro-claro) 0%, var(--ouro) 58%, #8e7c40 100%);
      color: var(--preto);
      box-shadow: 0 14px 34px rgba(172,151,81,.26);
    }
    .btn--ouro:hover { transform: translateY(-2px); box-shadow: 0 18px 42px rgba(172,151,81,.38); }
    .btn--linha { border: 1px solid rgba(172,151,81,.55); color: var(--off-white); }

    /* Moldura de foto — mesma das outras páginas. */
    .moldura {
      position: relative;
      border-radius: 20px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 30px 90px rgba(0,0,0,.55);
    }
    .moldura img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Tipografia de lâmina. ⚠️ Regra nº 1: nunca dourado no meio do texto —
       o ouro é do rótulo e dos fios, não da frase. */
    .rotulo-lamina {
      font-size: clamp(10px, .74vw, 11.5px);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--ouro);
      margin-bottom: 14px;
    }
    .titulo-lamina {
      font-size: clamp(28px, 3.6vw, 52px);
      font-weight: 200;
      line-height: 1.12;
      letter-spacing: -.01em;
      text-wrap: balance;
    }
    .titulo-lamina strong { font-weight: 500; }
    .texto-lamina {
      margin-top: 18px;
      max-width: 62ch;
      font-size: clamp(14px, 1.05vw, 16.5px);
      font-weight: 300;
      line-height: 1.75;
      color: var(--texto-fraco);
    }
    .texto-lamina b { font-weight: 500; color: var(--off-white); }

    /* ============================================================
       DOBRA 1 — ABERTURA

       A planta veio de uma referência que o James aprovou: a foto do
       profissional recortada NO MEIO, o nome dele em letra gigante ATRÁS
       (a cabeça atravessa a palavra), e o texto curto com o botão no
       rodapé. O fundo é a casa da própria clínica com uma fumaça preta
       por cima.

       ⚠️ A foto do James saiu do Higgsfield a partir da foto REAL do site
       antigo, e o único pedido foi abrir o sorriso. O que NÃO podia mudar
       foi conferido um a um: rosto, óculos, jaleco, o bordado do peito, a
       etiqueta JAMESOLAYA e o brasão JAY.O. A foto original sem retoque
       continua no repositório (james-hero.webp) pra poder voltar.
       ============================================================ */
    .hero {
      position: relative;
      min-height: min(94vh, 920px);
      overflow: hidden;
      display: flex;
      align-items: flex-end;
    }

    /* A casa: já sai desfocada do arquivo (é fundo, não assunto) e a
       fumaça preta entra por cima em três camadas — de baixo, das
       laterais e um miolo que abre pra luz atrás dele. */
    .hero__fundo { position: absolute; inset: 0; }
    .hero__fundo img {
      display: block;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 42% 62%;
    }
    .hero__fumaca {
      position: absolute; inset: 0;
      background:
        radial-gradient(58% 52% at 50% 40%, rgba(172,151,81,.16) 0%, rgba(172,151,81,0) 62%),
        radial-gradient(78% 70% at 50% 46%, rgba(7,6,5,0) 22%, rgba(7,6,5,.72) 78%, rgba(7,6,5,.94) 100%),
        linear-gradient(to top, var(--fundo) 4%, rgba(7,6,5,.72) 28%, rgba(7,6,5,.34) 58%, rgba(7,6,5,.82) 100%);
    }

    .hero__palco {
      position: relative;
      width: 100%;
      min-height: inherit;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    /* O nome atrás. ⚠️ aria-hidden: pra quem usa leitor de tela isto é
       decoração — o nome dele já está no <h1> e sairia dobrado. */
    .hero__nome {
      position: absolute;
      left: 0; right: 0;
      top: 40%;
      transform: translateY(-50%);
      text-align: center;
      font-size: clamp(46px, 12.4vw, 186px);
      font-weight: 200;
      line-height: .92;
      letter-spacing: -.02em;
      white-space: nowrap;
      color: var(--off-white);
      /* Some nas pontas: a palavra é maior que a tela de propósito, e o
         corte reto na borda pareceria texto vazando. */
      -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
              mask-image: linear-gradient(to right, transparent 0%, #000 12%, #000 88%, transparent 100%);
    }

    /* Ele. A altura manda no tamanho da dobra; a largura vem junto. */
    .hero__james {
      position: relative;
      z-index: 2;
      /* ⚠️ 840px é a altura REAL do recorte. Passar disso é ampliar, e
         aí aparece o pixel — a régua que o James cobrou em 05/08. */
      height: min(72vh, 840px);
      width: auto;
      max-width: 96vw;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 34px 70px rgba(0,0,0,.7));
    }

    /* Rodapé da dobra: a frase e o botão à esquerda, como na referência. */
    .hero__rodape {
      position: absolute;
      z-index: 3;
      left: 0; right: 0; bottom: clamp(34px, 4.6vw, 66px);
      width: 90%; max-width: 1440px;
      margin: 0 auto;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
    }
    .hero__texto { max-width: 34ch; }
    .hero__rotulo {
      font-size: clamp(10px, .74vw, 11.5px);
      letter-spacing: .3em;
      text-transform: uppercase;
      color: var(--ouro);
      margin-bottom: 12px;
    }
    .hero__frase {
      font-size: clamp(14px, 1.05vw, 16.5px);
      font-weight: 300;
      line-height: 1.7;
      color: var(--texto-fraco);
    }
    .hero__acao { margin-top: 22px; }

    /* O selo da direita — quem é ele, em duas linhas. */
    .hero__selo {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px 14px 16px;
      border: 1px solid var(--linha);
      border-radius: 999px;
      background: rgba(14,12,10,.62);
      backdrop-filter: blur(8px);
    }
    .hero__selo span { display: block; }
    .hero__selo b {
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: .02em;
    }
    .hero__selo i {
      font-style: normal;
      font-size: 11px;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: var(--ouro);
    }
    .hero__selo em {
      font-style: normal;
      width: 34px; height: 34px;
      border-radius: 50%;
      border: 1px solid var(--linha);
      background: url('/lp/clinica/james-jaleco.webp') center 12% / 190% no-repeat;
    }

    /* Celular: a palavra atrás encolhe pra caber sem virar rabisco, ele
       ocupa menos altura, e o rodapé sai de cima da foto e vira bloco. */
    @media (max-width: 900px) {
      .hero {
        min-height: 0;
        flex-direction: column;
        padding-top: clamp(96px, 26vw, 130px);
      }
      .hero__palco { min-height: 0; }
      /* Sobe: em 34% a palavra cruzava a boca dele e virava rasura. */
      .hero__nome {
        top: 18%;
        font-size: clamp(38px, 15vw, 76px);
        letter-spacing: -.01em;
      }
      .hero__james { height: min(52vh, 520px); }
      .hero__rodape {
        position: static;
        flex-direction: column;
        align-items: flex-start;
        padding-bottom: clamp(40px, 10vw, 64px);
      }
      .hero__texto { max-width: none; }
      .hero__selo { align-self: stretch; }
      .hero__fumaca {
        background:
          radial-gradient(70% 40% at 50% 34%, rgba(172,151,81,.14) 0%, rgba(172,151,81,0) 70%),
          linear-gradient(to top, var(--fundo) 6%, rgba(7,6,5,.74) 34%, rgba(7,6,5,.42) 62%, rgba(7,6,5,.88) 100%);
      }
    }


    /* Entrada suave — um respiro, não animação de template. */
    .surge { opacity: 0; transform: translateY(22px); transition: opacity .7s ease, transform .7s ease; }
    .surge.visivel { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      .surge { opacity: 1; transform: none; transition: none; }
    }

  </style>
</head>
<body>

  <!-- ============ DOBRA 1 — ABERTURA ============ -->
  <section class="hero">
    <div class="hero__fundo">
      <!-- A casa da clínica. alt vazio: é ambiente, e quem usa leitor de
           tela não ganha nada ouvindo a descrição de um fundo desfocado. -->
      <img src="/lp/clinica/hero-casa.jpg" alt="" />
      <div class="hero__fumaca"></div>
    </div>

    <div class="hero__palco">
      <p class="hero__nome" aria-hidden="true">James Olaya</p>
      <!-- ⚠️ Esta foto passou pelo Higgsfield: a base é a foto REAL do site
           antigo, e o único pedido foi abrir o sorriso. Rosto, óculos,
           jaleco, o bordado "DR. JAMES OLAYA / Biomédico Esteta", a
           etiqueta "JAMESOLAYA" e o brasão JAY.O foram conferidos um a um
           contra o original. A foto real sem retoque continua no
           repositório em james-hero.webp, caso ele prefira voltar. -->
      <img
        class="hero__james"
        src="/lp/clinica/james-hero-ia.webp"
        width="1100" height="1691"
        alt="James Olaya de jaleco branco, de braços cruzados, sorrindo"
      />
    </div>

    <div class="hero__rodape">
      <div class="hero__texto">
        <p class="hero__rotulo">Jay Clinic · Campinas</p>
        <!-- ⚠️ Texto provisório até o James mandar o dele. O que está aqui
             é só o que dá pra afirmar: o que é, de quem é e onde fica. -->
        <h1 class="hero__frase">
          A clínica de James Olaya no Parque Taquaral: micropigmentação e
          estética avançada, com a mesma técnica que ele ensina.
        </h1>
        <div class="hero__acao">
          <a class="btn btn--ouro" href="https://wa.me/5519974037997" target="_blank" rel="noopener">Agendar atendimento</a>
        </div>
      </div>

      <div class="hero__selo">
        <em></em>
        <span>
          <b>Dr. James Olaya</b>
          <i>Biomédico esteta</i>
        </span>
      </div>
    </div>
  </section>

  <!-- ============================================================
       O RESTO DA PÁGINA ENTRA AQUI, de propósito em branco.

       Cada dobra que o James mandar entra aqui como:

         <section class="secao">
           <div class="faixa surge">
             <p class="rotulo-lamina">Rótulo</p>
             <h2 class="titulo-lamina">Título <strong>com peso</strong></h2>
             <p class="texto-lamina">Texto.</p>
           </div>
         </section>

       O sistema visual (cores, tipografia, molduras, espaçamento e o filete
       entre dobras) já está no <style> acima — então cada pedaço nasce no
       padrão da /academy e da /jamesolaya, sem remendo depois.
       ============================================================ -->

  <script>
    // Entrada suave das dobras. Uma vez ao aparecer — nada de escala seguindo
    // a rolagem, que o James lê como bug ("está dando zoom").
    const olho = new IntersectionObserver((entradas) => {
      for (const e of entradas) {
        if (e.isIntersecting) { e.target.classList.add('visivel'); olho.unobserve(e.target); }
      }
    }, { threshold: .12 });
    document.querySelectorAll('.surge').forEach((el) => olho.observe(el));
  </script>

</body>
</html>
