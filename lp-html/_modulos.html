<!-- ===== SEÇÃO "O QUE VAI APRENDER" — REDESIGN (cabeçalho + stats + trilho Netflix) ===== -->
<style>
.ffr-mod{position:relative;background:radial-gradient(120% 90% at 50% 0%,#1a1024 0%,#0c0913 55%,#0a070f 100%);font-family:'Poppins',system-ui,sans-serif;padding:78px 0 90px;overflow:hidden;}
.ffr-mod::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:680px;height:340px;background:radial-gradient(closest-side,rgba(168,85,247,.22),transparent 70%);pointer-events:none;}
.ffr-mod__head{position:relative;text-align:center;max-width:760px;margin:0 auto 38px;padding:0 20px;}
.ffr-mod__eyebrow{color:#c084fc;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0 0 12px;}
.ffr-mod__title{font-size:clamp(30px,5vw,56px);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:0 0 10px;background:linear-gradient(92deg,#f5a8e0 0%,#c084fc 45%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-mod__sub{font-size:clamp(16px,2.3vw,24px);font-weight:500;color:#e7e1f2;margin:0;}
.ffr-mod__sub span{position:relative;font-weight:700;color:#fff;white-space:nowrap;}
.ffr-mod__sub span::after{content:"";position:absolute;left:0;right:0;bottom:-4px;height:7px;border-radius:4px;background:linear-gradient(90deg,#22c55e,#86efac);opacity:.85;}
/* stats */
.ffr-mod__stats{position:relative;display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:0 auto 50px;padding:0 20px;}
.ffr-stat{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:138px;padding:20px 26px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.09);border-radius:16px;backdrop-filter:blur(6px);}
.ffr-stat__num{font-size:46px;font-weight:800;line-height:1;background:linear-gradient(180deg,#f5a8e0,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-stat:nth-child(2) .ffr-stat__num{background:linear-gradient(180deg,#7dd3fc,#38bdf8);-webkit-background-clip:text;background-clip:text;}
.ffr-stat:nth-child(3) .ffr-stat__num{background:linear-gradient(180deg,#86efac,#22c55e);-webkit-background-clip:text;background-clip:text;}
.ffr-stat__lbl{margin-top:7px;font-size:14px;font-weight:500;color:#b9b2c9;}
/* trilho netflix */
.ffr-rail{position:relative;max-width:1280px;margin:0 auto;}
.ffr-row{display:flex;gap:18px;overflow-x:auto;scroll-behavior:smooth;scroll-snap-type:x proximity;padding:30px 48px;-ms-overflow-style:none;scrollbar-width:none;}
.ffr-row::-webkit-scrollbar{display:none;}
.ffr-card{position:relative;flex:0 0 auto;width:clamp(190px,22vw,250px);aspect-ratio:600/1050;border-radius:16px;overflow:hidden;scroll-snap-align:center;cursor:pointer;background:#15101e;box-shadow:0 18px 40px rgba(0,0,0,.45);transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s;}
.ffr-card img{width:100%;height:100%;object-fit:cover;display:block;}
.ffr-card__ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:18px 16px;background:linear-gradient(180deg,rgba(10,7,15,0) 40%,rgba(10,7,15,.92) 100%);opacity:0;transition:opacity .35s;}
.ffr-card__ov p{margin:0;color:#f2eefa;font-size:13.5px;font-weight:500;line-height:1.45;transform:translateY(10px);transition:transform .35s;}
.ffr-card:hover{transform:translateY(-10px) scale(1.045);box-shadow:0 28px 60px rgba(168,85,247,.4),0 0 0 2px rgba(192,132,252,.55);z-index:5;}
.ffr-card:hover .ffr-card__ov{opacity:1;}
.ffr-card:hover .ffr-card__ov p{transform:translateY(0);}
.ffr-nav{position:absolute;top:50%;transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(16,12,22,.92);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:background .2s,transform .2s,opacity .2s;backdrop-filter:blur(6px);}
.ffr-nav:hover{background:rgba(168,85,247,.55);transform:translateY(-50%) scale(1.08);}
.ffr-nav.ffr-prev{left:0;}
.ffr-nav.ffr-next{right:0;}
.ffr-nav[disabled]{opacity:0;pointer-events:none;}
.ffr-rail::before,.ffr-rail::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:10;pointer-events:none;}
.ffr-rail::before{left:0;background:linear-gradient(90deg,#0c0913,transparent);}
.ffr-rail::after{right:0;background:linear-gradient(270deg,#0c0913,transparent);}
@media(max-width:680px){
  .ffr-mod{padding:54px 0 64px;}
  .ffr-row{padding:24px 20px;gap:12px;}
  .ffr-card{width:clamp(160px,62vw,210px);}
  .ffr-nav{display:none;}
  .ffr-rail::before,.ffr-rail::after{width:24px;}
  .ffr-stat{min-width:104px;padding:15px 16px;}
  .ffr-stat__num{font-size:36px;}
  .ffr-card__ov{opacity:1;}
  .ffr-card__ov p{transform:translateY(0);}
}
</style>
<div id="ffr-mod-wrap" style="display:none">
  <section class="ffr-mod">
    <div class="ffr-mod__head">
      <p class="ffr-mod__eyebrow">Conteúdo do curso</p>
      <h2 class="ffr-mod__title">O que vai aprender</h2>
      <p class="ffr-mod__sub">O <span>curso mais completo</span> do mercado</p>
    </div>
    <div class="ffr-mod__stats">
      <div class="ffr-stat"><span class="ffr-stat__num">12</span><span class="ffr-stat__lbl">Módulos</span></div>
      <div class="ffr-stat"><span class="ffr-stat__num">81</span><span class="ffr-stat__lbl">Aulas</span></div>
      <div class="ffr-stat"><span class="ffr-stat__num">3</span><span class="ffr-stat__lbl">Bônus</span></div>
    </div>
    <div class="ffr-rail">
      <button class="ffr-nav ffr-prev" id="ffrRowPrev" type="button" aria-label="Voltar">&#8249;</button>
      <div class="ffr-row" id="ffrRow"></div>
      <button class="ffr-nav ffr-next" id="ffrRowNext" type="button" aria-label="Avançar">&#8250;</button>
    </div>
  </section>
</div>
<script>
(function(){
  var BASE="https://brbpjjqigpmxombzbxiu.supabase.co/storage/v1/object/public/media/wpmirror/";
  var MODS=[
    {f:"ed9555c9832c-modulo-0111-e5fe98a56b.png",d:"As etapas do realismo e como agregar valor ao seu trabalho."},
    {f:"bb8b60a6e33e-modulo-021-d4e67d7146.png",d:"As estruturas faciais e como elas influenciam no visagismo."},
    {f:"f52403dd7b41-modulo-031-ee741d35c7.png",d:"Como iniciar um processo de design e visagismo de excelência."},
    {f:"7fc9c2b85fd2-modulo-041-0ad80a45b9.png",d:"Como funciona uma sobrancelha real para entregar um resultado natural."},
    {f:"d15c93573279-modulo-051-607b42689d.png",d:"Avaliação de cor, densidade e saturação na prática."},
    {f:"91e0b8b558ec-modulo-061-85d466d688.png",d:"O conceito de densidade por sobreposição, passo a passo."},
    {f:"1f8165036282-modulo-07-708e7d70fd.jpg",d:"Linhas de tensão, angulação, pouso e decolagem, entradas e saídas."},
    {f:"9a22136cb84d-modulo-081-5247283ab9.png",d:"Design exclusivo dentro das proporções faciais do cliente."},
    {f:"8f37b1f14d43-modulo-091-ce937ae886.png",d:"Detalhes de acabamento, profundidade e saídas perfeitas dos fios."},
    {f:"b46af3982ff8-modulo-101-f590753b88.png",d:"Exercícios técnicos e treino em pele artificial para evoluir em casa."},
    {f:"1dc29627b352-modulo-111-6e640b96b0.png",d:"Um procedimento real, em alta qualidade e de vários ângulos."},
    {f:"d2a37520f24d-modulo-121-ca31e71778.png",d:"Retoque, cuidados pós-procedimento e adaptações para a cliente."}
  ];
  var mounted=false;

  function build(){
    var row=document.getElementById("ffrRow");
    if(!row) return;
    MODS.forEach(function(m,i){
      var c=document.createElement("div");
      c.className="ffr-card";
      var img=document.createElement("img");
      img.src=BASE+m.f; img.alt="Módulo "+(i+1); img.loading="lazy";
      var ov=document.createElement("div");
      ov.className="ffr-card__ov";
      var p=document.createElement("p"); p.textContent=m.d;
      ov.appendChild(p);
      c.appendChild(img); c.appendChild(ov);
      row.appendChild(c);
    });
    var prev=document.getElementById("ffrRowPrev");
    var next=document.getElementById("ffrRowNext");
    function step(){ return Math.round(row.clientWidth*0.82); }
    prev.addEventListener("click",function(){ row.scrollBy({left:-step(),behavior:"smooth"}); });
    next.addEventListener("click",function(){ row.scrollBy({left:step(),behavior:"smooth"}); });
    function upd(){
      prev.disabled = row.scrollLeft<=4;
      next.disabled = row.scrollLeft >= (row.scrollWidth-row.clientWidth-4);
    }
    row.addEventListener("scroll",upd); window.addEventListener("resize",upd);
    // arrasta com o mouse
    var down=false,sx=0,sl=0,moved=false;
    row.addEventListener("pointerdown",function(e){ down=true;moved=false;sx=e.clientX;sl=row.scrollLeft;row.style.scrollBehavior="auto"; });
    window.addEventListener("pointermove",function(e){ if(!down)return; var dx=e.clientX-sx; if(Math.abs(dx)>4)moved=true; row.scrollLeft=sl-dx; });
    window.addEventListener("pointerup",function(){ if(down){down=false;row.style.scrollBehavior="smooth";} });
    row.addEventListener("click",function(e){ if(moved){ e.preventDefault();e.stopPropagation(); } },true);
    upd();
  }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-mod-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("O que vai aprender")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
