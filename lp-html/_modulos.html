<!-- ===== SEÇÃO "O QUE VAI APRENDER" — REDESIGN STREAMING "TOP 12" (números gigantes vazados) ===== -->
<style>
.ffr-mod{position:relative;background:radial-gradient(120% 90% at 50% 0%,#1a1024 0%,#0c0913 55%,#0a070f 100%);font-family:'Poppins',system-ui,sans-serif;padding:74px 0 86px;overflow:hidden;}
.ffr-mod::before{content:"";position:absolute;top:-140px;left:50%;transform:translateX(-50%);width:760px;height:380px;background:radial-gradient(closest-side,rgba(168,85,247,.2),transparent 70%);pointer-events:none;}
/* cabeçalho estilo "rail" de streaming, alinhado à esquerda */
.ffr-mod__head{position:relative;max-width:1280px;margin:0 auto 6px;padding:0 48px;}
.ffr-mod__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#c084fc;font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin:0 0 14px;}
.ffr-mod__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-mod__title{font-size:clamp(32px,5.2vw,60px);font-weight:800;line-height:1;letter-spacing:-.025em;margin:0 0 16px;color:#fff;}
.ffr-mod__title b{background:linear-gradient(92deg,#f5a8e0 0%,#c084fc 50%,#a855f7 100%);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:800;}
/* metadata cinematográfica (sub + stats numa faixa só) */
.ffr-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap;color:#cfc7de;font-size:14.5px;font-weight:500;letter-spacing:.02em;}
.ffr-meta b{color:#fff;font-weight:700;}
.ffr-meta .ffr-tag{color:#86efac;border:1px solid rgba(134,239,172,.4);border-radius:999px;padding:3px 11px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;}
.ffr-meta i{width:4px;height:4px;border-radius:50%;background:#6b6280;font-style:normal;}
/* trilho top-12 */
.ffr-rail{position:relative;max-width:1280px;margin:18px auto 0;}
.ffr-row{display:flex;align-items:flex-end;gap:0;overflow-x:auto;scroll-behavior:smooth;padding:54px 48px 28px;-ms-overflow-style:none;scrollbar-width:none;}
.ffr-row::-webkit-scrollbar{display:none;}
.ffr-item{flex:0 0 auto;display:flex;align-items:flex-end;margin-right:26px;}
.ffr-item__num{font-size:clamp(150px,18vw,272px);font-weight:800;line-height:.7;letter-spacing:-.07em;color:transparent;-webkit-text-stroke:2.5px rgba(196,141,253,.72);margin-right:-.16em;position:relative;z-index:1;user-select:none;transition:-webkit-text-stroke .3s;align-self:flex-end;padding-bottom:6px;}
.ffr-poster{position:relative;z-index:2;flex:0 0 auto;width:clamp(186px,19.5vw,242px);aspect-ratio:600/1050;border-radius:14px;overflow:hidden;background:#15101e;box-shadow:0 22px 48px rgba(0,0,0,.55);cursor:pointer;transition:transform .38s cubic-bezier(.22,.61,.36,1),box-shadow .38s;}
.ffr-poster img{width:100%;height:100%;object-fit:cover;display:block;}
.ffr-poster__ov{position:absolute;inset:0;display:flex;align-items:flex-end;padding:18px 16px;background:linear-gradient(180deg,rgba(10,7,15,0) 42%,rgba(10,7,15,.94) 100%);opacity:0;transition:opacity .38s;}
.ffr-poster__ov p{margin:0;color:#f2eefa;font-size:13.5px;font-weight:500;line-height:1.45;transform:translateY(10px);transition:transform .38s;}
.ffr-item:hover .ffr-poster{transform:translateY(-10px) scale(1.04);box-shadow:0 30px 64px rgba(168,85,247,.42),0 0 0 2px rgba(196,141,253,.6);}
.ffr-item:hover .ffr-item__num{-webkit-text-stroke:2.5px rgba(245,168,224,.95);}
.ffr-item:hover .ffr-poster__ov{opacity:1;}
.ffr-item:hover .ffr-poster__ov p{transform:translateY(0);}
/* setas */
.ffr-nav{position:absolute;top:calc(50% + 14px);transform:translateY(-50%);width:50px;height:50px;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(16,12,22,.92);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:20;transition:background .2s,transform .2s,opacity .2s;backdrop-filter:blur(6px);}
.ffr-nav:hover{background:rgba(168,85,247,.55);transform:translateY(-50%) scale(1.08);}
.ffr-nav.ffr-prev{left:4px;}
.ffr-nav.ffr-next{right:4px;}
.ffr-nav[disabled]{opacity:0;pointer-events:none;}
.ffr-rail::after{content:"";position:absolute;top:0;bottom:0;right:0;width:80px;z-index:10;pointer-events:none;background:linear-gradient(270deg,#0c0913,transparent);}
@media(max-width:680px){
  .ffr-mod{padding:50px 0 60px;}
  .ffr-mod__head{padding:0 20px;}
  .ffr-row{padding:40px 20px 22px;}
  .ffr-item{margin-right:14px;}
  .ffr-item__num{-webkit-text-stroke-width:2px;margin-right:-.12em;}
  .ffr-poster{width:clamp(150px,52vw,200px);}
  .ffr-nav{display:none;}
  .ffr-poster__ov{opacity:1;}
  .ffr-poster__ov p{transform:translateY(0);}
}
</style>
<div id="ffr-mod-wrap" style="display:none">
  <section class="ffr-mod">
    <div class="ffr-mod__head">
      <p class="ffr-mod__eyebrow">Conteúdo do curso</p>
      <h2 class="ffr-mod__title">O que vai <b>aprender</b></h2>
      <div class="ffr-meta">
        <span class="ffr-tag">O curso mais completo do mercado</span>
        <i></i><span><b>12</b> Módulos</span>
        <i></i><span><b>81</b> Aulas</span>
        <i></i><span><b>3</b> Bônus</span>
      </div>
    </div>
    <div class="ffr-rail">
      <button class="ffr-nav ffr-prev" id="ffrRowPrev" type="button" aria-label="Voltar">&#8249;</button>
      <div class="ffr-row" id="ffrRow"></div>
      <button class="ffr-nav ffr-next" id="ffrRowNext" type="button" aria-label="Avançar">&#8250;</button>
    </div>
  </section>
</div>
<script>
(function(){
  var BASE="https://brbpjjqigpmxombzbxiu.supabase.co/storage/v1/object/public/media/wpmirror/";
  var MODS=[
    {f:"ed9555c9832c-modulo-0111-e5fe98a56b.png",d:"As etapas do realismo e como agregar valor ao seu trabalho."},
    {f:"bb8b60a6e33e-modulo-021-d4e67d7146.png",d:"As estruturas faciais e como elas influenciam no visagismo."},
    {f:"f52403dd7b41-modulo-031-ee741d35c7.png",d:"Como iniciar um processo de design e visagismo de excelência."},
    {f:"7fc9c2b85fd2-modulo-041-0ad80a45b9.png",d:"Como funciona uma sobrancelha real para entregar um resultado natural."},
    {f:"d15c93573279-modulo-051-607b42689d.png",d:"Avaliação de cor, densidade e saturação na prática."},
    {f:"91e0b8b558ec-modulo-061-85d466d688.png",d:"O conceito de densidade por sobreposição, passo a passo."},
    {f:"1f8165036282-modulo-07-708e7d70fd.jpg",d:"Linhas de tensão, angulação, pouso e decolagem, entradas e saídas."},
    {f:"9a22136cb84d-modulo-081-5247283ab9.png",d:"Design exclusivo dentro das proporções faciais do cliente."},
    {f:"8f37b1f14d43-modulo-091-ce937ae886.png",d:"Detalhes de acabamento, profundidade e saídas perfeitas dos fios."},
    {f:"b46af3982ff8-modulo-101-f590753b88.png",d:"Exercícios técnicos e treino em pele artificial para evoluir em casa."},
    {f:"1dc29627b352-modulo-111-6e640b96b0.png",d:"Um procedimento real, em alta qualidade e de vários ângulos."},
    {f:"d2a37520f24d-modulo-121-ca31e71778.png",d:"Retoque, cuidados pós-procedimento e adaptações para a cliente."}
  ];
  var mounted=false;

  function build(){
    var row=document.getElementById("ffrRow");
    if(!row) return;
    MODS.forEach(function(m,i){
      var item=document.createElement("div");
      item.className="ffr-item";
      var num=document.createElement("span");
      num.className="ffr-item__num"; num.textContent=(i+1<10?"0":"")+(i+1);
      var poster=document.createElement("div");
      poster.className="ffr-poster";
      var img=document.createElement("img");
      img.src=BASE+m.f; img.alt="Módulo "+(i+1); img.loading="lazy";
      var ov=document.createElement("div"); ov.className="ffr-poster__ov";
      var p=document.createElement("p"); p.textContent=m.d; ov.appendChild(p);
      poster.appendChild(img); poster.appendChild(ov);
      item.appendChild(num); item.appendChild(poster);
      row.appendChild(item);
    });
    var prev=document.getElementById("ffrRowPrev");
    var next=document.getElementById("ffrRowNext");
    function stp(){ return Math.round(row.clientWidth*0.82); }
    prev.addEventListener("click",function(){ row.scrollBy({left:-stp(),behavior:"smooth"}); });
    next.addEventListener("click",function(){ row.scrollBy({left:stp(),behavior:"smooth"}); });
    function upd(){
      prev.disabled = row.scrollLeft<=4;
      next.disabled = row.scrollLeft >= (row.scrollWidth-row.clientWidth-4);
    }
    row.addEventListener("scroll",upd); window.addEventListener("resize",upd);
    var down=false,sx=0,sl=0,moved=false;
    row.addEventListener("pointerdown",function(e){ down=true;moved=false;sx=e.clientX;sl=row.scrollLeft;row.style.scrollBehavior="auto"; });
    window.addEventListener("pointermove",function(e){ if(!down)return; var dx=e.clientX-sx; if(Math.abs(dx)>4)moved=true; row.scrollLeft=sl-dx; });
    window.addEventListener("pointerup",function(){ if(down){down=false;row.style.scrollBehavior="smooth";} });
    row.addEventListener("click",function(e){ if(moved){ e.preventDefault();e.stopPropagation(); } },true);
    upd();
  }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-mod-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("O que vai aprender")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
