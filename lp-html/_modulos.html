<!-- ===== SEÇÃO "O QUE VAI APRENDER" — celular com módulos passando (ideia do James) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&display=swap" rel="stylesheet">
<style>
.ffr-learn{position:relative;background:radial-gradient(130% 110% at 82% 18%,#3a2358 0%,#2a1840 46%,#1b0e2b 100%);font-family:'Poppins',system-ui,sans-serif;padding:58px 0 60px;overflow:hidden;}
.ffr-learn::before{content:"";position:absolute;top:-120px;right:6%;width:520px;height:520px;background:radial-gradient(closest-side,rgba(168,85,247,.28),transparent 70%);pointer-events:none;}
.ffr-learn__wrap{position:relative;max-width:1200px;margin:0 auto;padding:0 40px;display:flex;align-items:center;gap:clamp(28px,5vw,70px);}
.ffr-learn__left{flex:1 1 0;min-width:0;}
.ffr-learn__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#d6b6ff;font-size:12.5px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;margin:0 0 16px;}
.ffr-learn__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-learn__title{font-family:'Syne',sans-serif;font-size:clamp(34px,4.6vw,58px);font-weight:800;line-height:1.02;letter-spacing:-.01em;margin:0 0 14px;color:#fff;}
.ffr-learn__title b{font-weight:800;background:linear-gradient(92deg,#f5a8e0,#c084fc 55%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-learn__sub{font-size:clamp(15px,1.8vw,19px);font-weight:500;color:#e3d9f2;margin:0 0 30px;max-width:430px;line-height:1.5;}
.ffr-learn__stats{display:flex;gap:16px;flex-wrap:wrap;}
.ffr-stat2{flex:1 1 0;min-width:104px;background:#fff;border-radius:18px;padding:20px 14px;text-align:center;box-shadow:0 14px 34px rgba(0,0,0,.28);}
.ffr-stat2 b{display:block;font-family:'Syne',sans-serif;font-size:clamp(30px,3vw,42px);font-weight:800;line-height:1;background:linear-gradient(180deg,#a855f7,#7c3aed);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-stat2:nth-child(2) b{background:linear-gradient(180deg,#ec4899,#a855f7);-webkit-background-clip:text;background-clip:text;}
.ffr-stat2:nth-child(3) b{background:linear-gradient(180deg,#22c55e,#15a34a);-webkit-background-clip:text;background-clip:text;}
.ffr-stat2 span{display:block;margin-top:7px;font-size:12.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#3b2a52;}
/* celular */
.ffr-learn__right{flex:0 0 auto;display:flex;justify-content:center;}
.ffr-phone{position:relative;width:clamp(248px,28vw,322px);aspect-ratio:1/2.04;background:linear-gradient(150deg,#26202e,#0c0911);border-radius:46px;padding:11px;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 2px rgba(255,255,255,.06),inset 0 0 0 2px rgba(255,255,255,.04);}
.ffr-phone::after{content:"";position:absolute;inset:0;border-radius:46px;box-shadow:inset 0 1px 2px rgba(255,255,255,.18);pointer-events:none;}
.ffr-phone__screen{position:relative;width:100%;height:100%;border-radius:36px;overflow:hidden;background:#080610;}
.ffr-phone__island{position:absolute;top:13px;left:50%;transform:translateX(-50%);width:30%;height:22px;background:#000;border-radius:13px;z-index:8;}
.ffr-phone__bars{position:absolute;top:44px;left:13px;right:13px;display:flex;gap:4px;z-index:7;}
.ffr-bar{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.28);overflow:hidden;}
.ffr-bar span{display:block;height:100%;width:0;background:#fff;border-radius:2px;}
.ffr-slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;transform:scale(1.04);}
.ffr-slide.is-on{opacity:1;transform:scale(1);transition:opacity .6s ease,transform 2.2s ease;}
.ffr-slide img{width:100%;height:100%;object-fit:cover;display:block;}
.ffr-slide__cap{position:absolute;left:0;right:0;bottom:0;padding:54px 18px 20px;background:linear-gradient(180deg,transparent,rgba(8,5,14,.92));z-index:6;}
.ffr-slide__cap b{display:block;font-family:'Syne',sans-serif;color:#fff;font-size:16px;font-weight:700;letter-spacing:.04em;}
.ffr-slide__cap small{display:block;margin-top:3px;color:#c9bce0;font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;}
@media(max-width:820px){
  .ffr-learn{padding:48px 0 52px;}
  .ffr-learn__wrap{flex-direction:column;text-align:center;gap:38px;}
  .ffr-learn__eyebrow{justify-content:center;}
  .ffr-learn__sub{margin-left:auto;margin-right:auto;}
  .ffr-learn__stats{justify-content:center;}
  .ffr-phone{width:clamp(230px,72vw,290px);}
}
</style>
<div id="ffr-mod-wrap" style="display:none">
  <section class="ffr-learn">
    <div class="ffr-learn__wrap">
      <div class="ffr-learn__left">
        <p class="ffr-learn__eyebrow">A trilha completa</p>
        <h2 class="ffr-learn__title">Tudo o que você vai <b>dominar</b></h2>
        <p class="ffr-learn__sub">A formação mais completa e profunda do mercado — do primeiro traço ao realismo perfeito.</p>
        <div class="ffr-learn__stats">
          <div class="ffr-stat2"><b>12</b><span>Módulos</span></div>
          <div class="ffr-stat2"><b>81</b><span>Aulas</span></div>
          <div class="ffr-stat2"><b>3</b><span>Bônus</span></div>
        </div>
      </div>
      <div class="ffr-learn__right">
        <div class="ffr-phone">
          <div class="ffr-phone__screen">
            <div class="ffr-phone__island"></div>
            <div class="ffr-phone__bars" id="ffrBars"></div>
            <div id="ffrSlides"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
<script>
(function(){
  var BASE="https://brbpjjqigpmxombzbxiu.supabase.co/storage/v1/object/public/media/wpmirror/";
  var MODS=[
    {f:"ed9555c9832c-modulo-0111-e5fe98a56b.png",t:"Boas-vindas"},
    {f:"bb8b60a6e33e-modulo-021-d4e67d7146.png",t:"A face humana"},
    {f:"f52403dd7b41-modulo-031-ee741d35c7.png",t:"Designer facial"},
    {f:"7fc9c2b85fd2-modulo-041-0ad80a45b9.png",t:"Mentalidade do micropigmentador"},
    {f:"d15c93573279-modulo-051-607b42689d.png",t:"Essência da base"},
    {f:"91e0b8b558ec-modulo-061-85d466d688.png",t:"Densidade"},
    {f:"1f8165036282-modulo-07-708e7d70fd.jpg",t:"Técnica de implante"},
    {f:"9a22136cb84d-modulo-081-5247283ab9.png",t:"Arquitetura de fios"},
    {f:"8f37b1f14d43-modulo-091-ce937ae886.png",t:"Acabamentos"},
    {f:"b46af3982ff8-modulo-101-f590753b88.png",t:"Exercícios técnicos"},
    {f:"1dc29627b352-modulo-111-6e640b96b0.png",t:"Demonstração prática"},
    {f:"d2a37520f24d-modulo-121-ca31e71778.png",t:"Cuidados pós"}
  ];
  var DUR=1700, mounted=false, idx=0, slides=[], bars=[], timer=null;

  function build(){
    var sw=document.getElementById("ffrSlides"), bw=document.getElementById("ffrBars");
    if(!sw) return;
    MODS.forEach(function(m,i){
      var s=document.createElement("div"); s.className="ffr-slide";
      var img=document.createElement("img"); img.src=BASE+m.f; img.alt=m.t; img.loading= i<2?"eager":"lazy";
      var cap=document.createElement("div"); cap.className="ffr-slide__cap";
      cap.innerHTML="<small>Módulo "+((i+1<10?"0":"")+(i+1))+"</small><b>"+m.t+"</b>";
      s.appendChild(img); s.appendChild(cap); sw.appendChild(s); slides.push(s);
      var bar=document.createElement("div"); bar.className="ffr-bar";
      bar.appendChild(document.createElement("span")); bw.appendChild(bar); bars.push(bar.firstChild);
    });
    show(0); start();
    // pausa ao passar o mouse no celular
    var phone=sw.closest(".ffr-phone");
    if(phone){ phone.addEventListener("mouseenter",stop); phone.addEventListener("mouseleave",start); }
  }

  function show(i){
    slides[idx].classList.remove("is-on");
    idx=i;
    slides[idx].classList.add("is-on");
    bars.forEach(function(sp,k){
      sp.style.transition="none";
      sp.style.width = k<idx ? "100%" : "0%";
    });
    var cur=bars[idx];
    void cur.offsetWidth;
    cur.style.transition="width "+DUR+"ms linear";
    cur.style.width="100%";
  }
  function next(){ show((idx+1)%MODS.length); }
  function start(){ stop(); timer=setInterval(next,DUR); }
  function stop(){ if(timer){clearInterval(timer);timer=null;} }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-mod-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("O que vai aprender")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
<!-- ===== FIM SEÇÃO MÓDULOS ===== -->
