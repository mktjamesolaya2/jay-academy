<!-- ===== NOVO HERÓI FIO A FIO REALISTA (substitui o antigo) ===== -->
<style>
.ffr-hero{position:relative;width:100%;overflow:hidden;background:#0c0913;font-family:'Poppins',system-ui,sans-serif;}
/* Desktop: imagem INTEIRA, nunca corta o James (altura segue a imagem) */
.ffr-hero__img{display:block;width:100%;height:auto;}
.ffr-hero__ov{position:absolute;inset:0;pointer-events:none;}
.ffr-hero__content{position:absolute;inset:0;display:flex;align-items:center;z-index:2;}
.ffr-hero__inner{width:100%;max-width:1240px;margin:0;padding:0 6% 0 4%;}
.ffr-hero__col{max-width:560px;}
.ffr-hero__badge{display:inline-block;background:#22c55e;color:#04130b;font-weight:700;font-size:13px;padding:6px 15px;border-radius:6px;margin-bottom:24px;}
.ffr-hero h1{color:#fff;font-size:clamp(30px,4.4vw,54px);font-weight:800;line-height:1.04;letter-spacing:-0.02em;margin:0 0 20px;text-shadow:0 2px 24px rgba(0,0,0,.45);}
.ffr-hero__sub{color:#ece7f5;font-size:clamp(16px,2.1vw,24px);font-weight:500;margin:0 0 6px;}
.ffr-hero__hl{font-size:clamp(24px,3.4vw,40px);font-weight:800;line-height:1.05;margin:0 0 28px;background:linear-gradient(90deg,#c084fc,#f5a8e0);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-hero__cta{display:inline-block;background:#22c55e;color:#04130b;font-weight:700;font-size:16px;letter-spacing:.02em;padding:17px 36px;border-radius:9px;text-decoration:none;box-shadow:0 10px 34px rgba(34,197,94,.38);transition:transform .15s,box-shadow .15s;}
.ffr-hero__cta:hover{transform:translateY(-2px);box-shadow:0 14px 40px rgba(34,197,94,.5);}
/* Mobile: imagem cobre com foco no James + altura pro texto caber */
@media(max-width:760px){
  .ffr-hero{min-height:580px;}
  .ffr-hero__img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:60% center;}
  .ffr-hero__col{max-width:100%;}
}
</style>
<section class="ffr-hero">
  <img class="ffr-hero__img" src="/lp/fio-a-fio-realista/hero.webp?v=3" alt="Fio a Fio Realista por James Olaya">
  <!-- gradiente acinzentado+roxo nos cantos (centro transparente) -->
  <div class="ffr-hero__ov" style="background:radial-gradient(125% 125% at 50% 48%, rgba(10,8,16,0) 44%, rgba(46,28,64,0.5) 76%, rgba(13,9,19,0.9) 100%);"></div>
  <!-- escurece a esquerda pra leitura do texto -->
  <div class="ffr-hero__ov" style="background:linear-gradient(90deg, rgba(10,7,16,0.92) 0%, rgba(10,7,16,0.55) 30%, rgba(10,7,16,0) 56%);"></div>
  <div class="ffr-hero__content">
    <div class="ffr-hero__inner">
      <div class="ffr-hero__col">
        <span class="ffr-hero__badge">Nova Turma!</span>
        <h1>Destaque-se da concorrência e valorize o seu trabalho</h1>
        <p class="ffr-hero__sub">Domine a técnica de</p>
        <p class="ffr-hero__hl">Fio a Fio Realista</p>
        <a class="ffr-hero__cta" href="#inscricao">QUERO GARANTIR MINHA VAGA</a>
      </div>
    </div>
  </div>
</section>
<!-- ===== FIM NOVO HERÓI ===== -->
