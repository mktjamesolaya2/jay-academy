<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!-- Placeholder: o endereço já responde pra poder ser divulgado, mas não deve
     ser indexado enquanto o conteúdo do evento não entra. Ao publicar a LP de
     verdade, trocar o conteúdo deste arquivo e tirar o noindex. -->
<meta name="robots" content="noindex,nofollow">
<title>Encontro de Especialistas | Jay Academy</title>
<meta name="description" content="Encontro de Especialistas da Jay Academy. Em breve.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#08080a;--gold:#d9b458;--gold2:#f2d38a;--text:#f1edf2;--muted:#aaa3af;--line:rgba(242,211,138,.17)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:radial-gradient(75% 65% at 50% 28%,rgba(94,59,101,.28),transparent 70%),var(--bg);color:var(--text);font-family:Poppins,system-ui,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased;display:grid;place-items:center;padding:clamp(28px,7vw,72px) 22px}
main{width:min(640px,100%);text-align:center}
.eyebrow{display:inline-flex;align-items:center;gap:10px;color:var(--gold);font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;margin-bottom:20px}
.eyebrow:before,.eyebrow:after{content:"";width:30px;height:1.5px;background:linear-gradient(90deg,transparent,var(--gold))}
.eyebrow:after{background:linear-gradient(90deg,var(--gold),transparent)}
h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(38px,7vw,64px);line-height:1.04;color:#fff}
.soon{display:block;font-style:italic;color:var(--gold2);font-size:clamp(22px,4.2vw,34px);margin-top:14px}
p{color:var(--muted);font-size:clamp(14.5px,1.8vw,17px);font-weight:300;max-width:46ch;margin:22px auto 0}
.rule{width:64px;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:34px auto}
.back{display:inline-flex;align-items:center;gap:9px;color:var(--gold2);text-decoration:none;font-size:13px;letter-spacing:.06em;border:1px solid var(--line);border-radius:12px;padding:13px 24px;transition:.22s ease}
.back:hover{border-color:rgba(242,211,138,.45);background:rgba(242,211,138,.07)}
</style>
</head>
<body>
<main>
  <span class="eyebrow">Jay Academy</span>
  <h1>Encontro de Especialistas<span class="soon">Em breve</span></h1>
  <p>Estamos preparando os detalhes deste encontro. Guarde este endereço — as informações e as inscrições aparecem aqui.</p>
  <div class="rule"></div>
  <a class="back" href="/jamesolaya">Conhecer a Jay Academy</a>
</main>
</body>
</html>
