<!-- ===== SEÇÃO "VÁ ALÉM DO SHADOW" — imagem integrada no gradiente roxo (esq) + texto (dir) ===== -->
<style>
.ffr-sh{position:relative;font-family:'Poppins',system-ui,sans-serif;overflow:hidden;
  background:radial-gradient(90% 100% at 18% 50%, #241544 0%, #150d28 46%, #0a0712 100%);
  display:grid;grid-template-columns:1.05fr 1fr;align-items:center;min-height:clamp(420px,52vw,600px);}
/* imagem à esquerda, dissolvendo no fundo (integrada) */
.ffr-sh__img{position:relative;align-self:stretch;}
.ffr-sh__img img{width:100%;height:100%;object-fit:cover;display:block;
  filter:grayscale(.25) brightness(.82) contrast(1.04);
  -webkit-mask-image:
    linear-gradient(to right, transparent 0%, #000 32%, #000 70%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 22%, #000 80%, transparent 100%);
  -webkit-mask-composite:source-in;mask-composite:intersect;
  mask-image:
    linear-gradient(to right, transparent 0%, #000 32%, #000 70%, transparent 100%),
    linear-gradient(to bottom, transparent 0%, #000 22%, #000 80%, transparent 100%);}
.ffr-sh__img::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(110deg, rgba(36,21,68,.5) 0%, rgba(21,13,40,.35) 55%, rgba(10,7,18,.85) 100%);
  mix-blend-mode:multiply;}
.ffr-sh__img::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
  background:radial-gradient(120% 90% at 35% 50%, rgba(168,85,247,.18), transparent 65%);}
/* texto à direita */
.ffr-sh__txt{position:relative;z-index:2;padding:clamp(36px,5vw,72px) clamp(24px,6vw,80px) clamp(36px,5vw,72px) 0;}
.ffr-sh__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#e7b8ff;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0 0 16px;}
.ffr-sh__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-sh__title{font-size:clamp(30px,4.4vw,56px);font-weight:800;line-height:1.04;letter-spacing:-.02em;margin:0 0 20px;color:#fff;}
.ffr-sh__title b{background:linear-gradient(92deg,#f5a8e0,#c084fc 55%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-sh__sub{color:#e3dcf0;font-size:clamp(16px,1.9vw,20px);line-height:1.55;margin:0;max-width:30ch;}
.ffr-sh__sub strong{color:#fff;font-weight:600;}
@media(max-width:820px){
  .ffr-sh{grid-template-columns:1fr;min-height:0;}
  .ffr-sh__img{height:clamp(280px,70vw,420px);}
  .ffr-sh__img img{-webkit-mask-image:linear-gradient(to bottom, transparent 0%, #000 30%, #000 72%, transparent 100%);mask-image:linear-gradient(to bottom, transparent 0%, #000 30%, #000 72%, transparent 100%);}
  .ffr-sh__txt{padding:8px clamp(22px,6vw,32px) clamp(40px,9vw,56px);text-align:center;}
  .ffr-sh__eyebrow{justify-content:center;}
  .ffr-sh__sub{margin:0 auto;}
}
</style>
<div id="ffr-sh-wrap" style="display:none">
  <section class="ffr-sh">
    <div class="ffr-sh__img">
      <img src="/lp/fio-a-fio-realista/shadow.webp" alt="Resultado de micropigmentação de sobrancelhas" loading="lazy">
    </div>
    <div class="ffr-sh__txt">
      <p class="ffr-sh__eyebrow">Próximo nível</p>
      <h2 class="ffr-sh__title">Vá muito além do <b>shadow</b></h2>
      <p class="ffr-sh__sub">Domine as técnicas mais desejadas da micropigmentação e leve o <strong>faturamento do seu estúdio</strong> a outro patamar.</p>
    </div>
  </section>
</div>
<script>
(function(){
  var mounted=false;
  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-sh-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("além do shadow")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
<!-- ===== FIM SEÇÃO SHADOW ===== -->
