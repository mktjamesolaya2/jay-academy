<!-- ===== SEÇÃO DEPOIMENTOS — slider minimalista (hairlines) + play que abre o vídeo ===== -->
<style>
.ffr-dep{position:relative;font-family:'Poppins',system-ui,sans-serif;overflow:hidden;
  padding:clamp(60px,8vw,104px) 20px clamp(24px,3vw,40px);
  background:
    linear-gradient(180deg,#070509 0%,rgba(7,5,9,0) 14%,rgba(7,5,9,0) 86%,#070509 100%),
    radial-gradient(130% 110% at 82% 18%,#16121d 0%,#0d0a12 52%,#070509 100%);}
.ffr-dep::before{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.05) 1px, transparent 1.4px);background-size:26px 26px;opacity:.5;
  -webkit-mask-image:linear-gradient(90deg,#000,transparent 55%);mask-image:linear-gradient(90deg,#000,transparent 55%);}
.ffr-dep__wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:.78fr 1.22fr;gap:clamp(28px,4vw,60px);align-items:center;}
.ffr-dep__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#e7b8ff;font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;margin:0 0 16px;}
.ffr-dep__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-dep__title{font-size:clamp(30px,4vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.025em;margin:0 0 38px;color:#fff;}
.ffr-dep__title b{background:linear-gradient(92deg,#f5a8e0,#c084fc 55%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-dep__track{display:grid;grid-template-columns:1fr 1fr;gap:clamp(28px,3.5vw,48px);}
.ffr-dep__card{padding:24px 0 22px;
  border-top:1px solid rgba(192,132,252,.45);border-bottom:1px solid rgba(255,255,255,.1);}
.ffr-dep__stars{display:flex;gap:3px;margin:0 0 16px;}
.ffr-dep__stars svg{width:15px;height:15px;fill:#f5b740;}
.ffr-dep__quote{color:#d9d2e8;font-size:15.5px;line-height:1.62;margin:0 0 26px;}
.ffr-dep__foot{display:flex;align-items:center;gap:14px;}
.ffr-dep__play{flex:0 0 auto;width:50px;height:50px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#f5a8e0,#a855f7);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(168,85,247,.45);transition:transform .2s,box-shadow .2s;}
.ffr-dep__play:hover{transform:scale(1.08);box-shadow:0 12px 28px rgba(168,85,247,.6);}
.ffr-dep__play svg{width:20px;height:20px;fill:#fff;margin-left:2px;}
.ffr-dep__who b{display:block;color:#fff;font-size:15px;font-weight:700;}
.ffr-dep__who span{display:block;color:#a98cd6;font-size:12.5px;margin-top:2px;}
/* modal */
.ffr-dep__modal{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;background:rgba(5,3,9,.9);backdrop-filter:blur(6px);padding:24px;}
.ffr-dep__modal.is-open{display:flex;}
.ffr-dep__modal-inner{position:relative;width:min(920px,94vw);}
.ffr-dep__frame{position:relative;width:100%;padding-bottom:56.25%;border-radius:12px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);background:#000;}
.ffr-dep__frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
.ffr-dep__close{position:fixed;top:22px;right:24px;z-index:100000;width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);color:#fff;font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.ffr-dep__close:hover{background:rgba(168,85,247,.65);}
@media(max-width:820px){
  .ffr-dep__wrap{grid-template-columns:1fr;gap:30px;}
  .ffr-dep__title{margin-bottom:24px;}
  .ffr-dep__card{flex:0 0 84%;}
  .ffr-dep::before{-webkit-mask-image:none;mask-image:none;opacity:.3;}
}
</style>
<div id="ffr-dep-wrap" style="display:none">
  <section class="ffr-dep">
    <div class="ffr-dep__wrap">
      <div class="ffr-dep__left">
        <p class="ffr-dep__eyebrow">Depoimentos reais</p>
        <h2 class="ffr-dep__title">O que as alunas dizem sobre o <b>Fio a Fio Realista</b></h2>
      </div>
      <div class="ffr-dep__view">
        <div class="ffr-dep__track" id="ffrDepTrack"></div>
      </div>
    </div>
  </section>
</div>
<div class="ffr-dep__modal" id="ffrDepModal">
  <button class="ffr-dep__close" id="ffrDepClose" type="button" aria-label="Fechar">&times;</button>
  <div class="ffr-dep__modal-inner">
    <div class="ffr-dep__frame" id="ffrDepModalBody"></div>
  </div>
</div>
<script>
(function(){
  var DEP=[
    {id:"IbbX1miaGoI",name:"Aluna do Fio a Fio Realista",role:"Turma online",quote:"Ele entregou para a gente todo o conhecimento de uma técnica que muitas pessoas não sabem fazer, que é o fio a fio. E tive a alegria de saber que a parte teórica e prática tinha no online."},
    {id:"LCyp-yAH1WM",name:"Tânia Barros",role:"Aluna",quote:"Eu sempre via sobre micropigmentação, mas achava muito superficial. Quando vi o trabalho dele, mais sútil, suave, mais próximo do real… me deu vontade de aprender, porque me identifiquei com o trabalho dele."}
  ];
  var STAR='<svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>';
  var mounted=false, idx=0, track, prev, next, modal;

  function open(id){
    document.getElementById("ffrDepModalBody").innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0" title="Depoimento" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>';
    modal.classList.add("is-open");
  }
  function close(){ modal.classList.remove("is-open"); document.getElementById("ffrDepModalBody").innerHTML=""; }

  function build(){
    track=document.getElementById("ffrDepTrack");
    modal=document.getElementById("ffrDepModal");
    DEP.forEach(function(d){
      var c=document.createElement("div"); c.className="ffr-dep__card";
      c.innerHTML='<div class="ffr-dep__stars">'+STAR+STAR+STAR+STAR+STAR+'</div>'+
        '<p class="ffr-dep__quote">"'+d.quote+'"</p>'+
        '<div class="ffr-dep__foot">'+
          '<button class="ffr-dep__play" type="button" aria-label="Assistir depoimento"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>'+
          '<div class="ffr-dep__who"><b>'+d.name+'</b><span>'+d.role+'</span></div>'+
        '</div>';
      c.querySelector(".ffr-dep__play").addEventListener("click",function(){ open(d.id); });
      track.appendChild(c);
    });
    document.getElementById("ffrDepClose").addEventListener("click",close);
    modal.addEventListener("click",function(e){ if(e.target===modal) close(); });
    document.addEventListener("keydown",function(e){ if(e.key==="Escape") close(); });
  }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-dep-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("as alunas dizem")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
<!-- ===== FIM SEÇÃO DEPOIMENTOS ===== -->
