<!-- ===== FAIXA DIVISÓRIA — preta com bordas dissolvendo (feather estilo laser) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.ffr-div{position:relative;width:100%;overflow:hidden;text-align:center;background:#060507;
  padding:clamp(64px,11vh,120px) 16px;}
/* feather superior e inferior: a borda da faixa dissolve no preto, sem linha de emenda */
.ffr-div::before,.ffr-div::after{content:"";position:absolute;left:0;right:0;height:clamp(80px,14vh,140px);pointer-events:none;z-index:1;}
.ffr-div::before{top:0;background:linear-gradient(to bottom,#0c0a12 0%,rgba(6,5,7,0) 100%);}
.ffr-div::after{bottom:0;background:linear-gradient(to top,#0c0a12 0%,rgba(6,5,7,0) 100%);}
.ffr-div__txt{position:relative;z-index:2;margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:clamp(16px,2.4vw,28px);letter-spacing:clamp(.12em,.7vw,.34em);text-transform:uppercase;
  white-space:nowrap;color:#fff;}
@media(max-width:600px){
  .ffr-div{padding:clamp(48px,9vh,80px) 14px;}
  .ffr-div__txt{letter-spacing:.16em;font-size:clamp(14px,4.6vw,20px);}
}
</style>
<section class="ffr-div" id="ffr-divisor">
  <p class="ffr-div__txt">Mais que sobrancelhas, um novo olhar</p>
</section>
<!-- ===== FIM FAIXA DIVISÓRIA ===== -->
