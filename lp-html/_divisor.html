<!-- ===== FAIXA DIVISÓRIA (entre herói e carrossel) — estilo dourado da referência ===== -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.ffr-div{position:relative;width:100%;overflow:hidden;text-align:center;
  padding:clamp(72px,12vh,124px) 22px;
  background:
    radial-gradient(150% 130% at 50% 50%, rgba(214,176,96,.10), transparent 58%),
    linear-gradient(180deg,
      #efe6d6 0%, #b9ad98 6%, #423a2d 16%, #14110b 30%,
      #0a0805 50%,
      #14110b 70%, #423a2d 84%, #c2b6a0 94%, #f3ebdc 100%);}
.ffr-div::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(2px 2px at 18% 38%, rgba(255,240,200,.55), transparent 60%),
    radial-gradient(1.5px 1.5px at 76% 30%, rgba(255,240,200,.5), transparent 60%),
    radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,240,200,.4), transparent 60%),
    radial-gradient(1.5px 1.5px at 30% 66%, rgba(255,240,200,.35), transparent 60%);}
.ffr-div__inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:18px;}
.ffr-div__gem{width:11px;height:11px;transform:rotate(45deg);background:linear-gradient(135deg,#f6e3ad,#c8a052);box-shadow:0 0 14px rgba(214,176,96,.6);}
.ffr-div__txt{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:clamp(20px,3vw,40px);letter-spacing:.34em;text-transform:uppercase;line-height:1.2;
  background:linear-gradient(180deg,#fbeec2 0%,#d8b066 52%,#a87d30 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 1px 30px rgba(214,176,96,.25);padding-left:.34em;}
.ffr-div__line{display:block;width:clamp(120px,18vw,210px);height:1px;
  background:linear-gradient(90deg,transparent,rgba(214,176,96,.85),transparent);}
@media(max-width:600px){
  .ffr-div{padding:56px 18px;}
  .ffr-div__txt{letter-spacing:.2em;font-size:clamp(17px,5.4vw,24px);}
}
</style>
<section class="ffr-div">
  <div class="ffr-div__inner">
    <span class="ffr-div__gem"></span>
    <p class="ffr-div__txt">Mais que sobrancelhas, um novo olhar</p>
    <span class="ffr-div__line"></span>
  </div>
</section>
<!-- ===== FIM FAIXA DIVISÓRIA ===== -->
