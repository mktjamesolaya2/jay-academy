<!-- ===== FAIXA DIVISÓRIA (entre herói e carrossel) — minimalista, roxo degradê pra fora ===== -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
.ffr-div{position:relative;width:100%;overflow:hidden;text-align:center;
  padding:clamp(20px,3.4vh,34px) 16px;
  background:
    radial-gradient(ellipse 60% 130% at 50% 50%, rgba(168,85,247,0.26) 0%, rgba(124,58,173,0.09) 42%, transparent 72%),
    linear-gradient(180deg, #08080b 0%, #150f1f 50%, #08080b 100%);}
.ffr-div__txt{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;
  font-size:clamp(13px,2.4vw,24px);letter-spacing:clamp(.1em,.7vw,.3em);text-transform:uppercase;
  white-space:nowrap;color:#fff;text-shadow:0 1px 24px rgba(168,85,247,.3);}
</style>
<section class="ffr-div" id="ffr-divisor">
  <p class="ffr-div__txt">Mais que sobrancelhas, um novo olhar</p>
</section>
<!-- ===== FIM FAIXA DIVISÓRIA ===== -->
