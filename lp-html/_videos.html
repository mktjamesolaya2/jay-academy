<!-- ===== SEÇÃO VÍDEOS "NA PRÁTICA" — player em destaque + playlist ===== -->
<style>
.ffr-vid{position:relative;background:radial-gradient(120% 90% at 50% 0%,#181023 0%,#0d0a12 55%,#08060c 100%);font-family:'Poppins',system-ui,sans-serif;padding:74px 20px 84px;overflow:hidden;}
.ffr-vid::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:620px;height:320px;background:radial-gradient(closest-side,rgba(168,85,247,.18),transparent 70%);pointer-events:none;}
.ffr-vid__head{position:relative;text-align:center;max-width:680px;margin:0 auto 40px;}
.ffr-vid__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#c084fc;font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin:0 0 12px;}
.ffr-vid__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-vid__title{font-size:clamp(28px,4.4vw,50px);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:0;color:#fff;}
.ffr-vid__title b{background:linear-gradient(92deg,#f5a8e0,#c084fc 55%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
/* palco: player + playlist */
.ffr-vid__stage{position:relative;display:flex;gap:clamp(16px,2vw,24px);align-items:stretch;justify-content:center;max-width:880px;margin:0 auto;}
.ffr-vid__main{position:relative;flex:0 0 auto;width:clamp(260px,33vw,360px);aspect-ratio:9/16;border-radius:20px;overflow:hidden;background:#15101e;box-shadow:0 30px 70px rgba(0,0,0,.55),0 0 0 1px rgba(192,132,252,.4);}
.ffr-vid__main video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
.ffr-vid__list{display:flex;flex-direction:column;gap:clamp(10px,1.4vw,16px);}
.ffr-vid__thumb{position:relative;flex:1 1 0;width:clamp(78px,9vw,116px);min-height:0;border-radius:12px;overflow:hidden;cursor:pointer;background:#15101e;box-shadow:0 10px 24px rgba(0,0,0,.4);transition:transform .3s,box-shadow .3s;opacity:.7;}
.ffr-vid__thumb video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
.ffr-vid__thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,7,15,0) 50%,rgba(10,7,15,.55));}
.ffr-vid__thumb .ffr-vid__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:2;}
.ffr-vid__thumb .ffr-vid__play svg{width:11px;height:11px;fill:#fff;margin-left:1px;}
.ffr-vid__thumb:hover{transform:scale(1.04);opacity:1;}
.ffr-vid__thumb.is-active{opacity:1;box-shadow:0 10px 24px rgba(0,0,0,.4),0 0 0 2px #c084fc;}
.ffr-vid__thumb.is-active .ffr-vid__play{display:none;}
@media(max-width:680px){
  .ffr-vid{padding:54px 14px 64px;}
  .ffr-vid__stage{flex-direction:column;align-items:center;}
  .ffr-vid__main{width:min(78vw,300px);}
  .ffr-vid__list{flex-direction:row;width:100%;max-width:320px;}
  .ffr-vid__thumb{width:auto;aspect-ratio:9/16;}
}
</style>
<div id="ffr-vid-wrap" style="display:none">
  <section class="ffr-vid">
    <div class="ffr-vid__head">
      <p class="ffr-vid__eyebrow">Na prática</p>
      <h2 class="ffr-vid__title">Veja a técnica <b>em movimento</b></h2>
    </div>
    <div class="ffr-vid__stage">
      <div class="ffr-vid__main">
        <video id="ffrVidMain" playsinline muted loop autoplay controls preload="metadata"></video>
      </div>
      <div class="ffr-vid__list" id="ffrVidList"></div>
    </div>
  </section>
</div>
<script>
(function(){
  var B="https://brbpjjqigpmxombzbxiu.supabase.co/storage/v1/object/public/media/wpmirror/";
  var VIDS=[
    "b10a39e931ec-snapinsta.app-118651566-3287498404622196-5607887651076890258-n-5edcd683af.mp4",
    "3267b48f325a-snapinsta.app-118708879-321346189118582-8314541208787868570-n-c20ef8b019.mp4",
    "bd101e4bfb63-snapinsta.app-118692842-349397012914962-2903286034012503326-n-704702c23d.mp4",
    "b5e8876d62b6-snapinsta.app-118701628-998662293981544-2590609756776100733-n-3e76fcb236.mp4"
  ];
  var mounted=false, main=null, thumbs=[];

  function select(i){
    if(!main) return;
    main.src=B+VIDS[i];
    main.muted=true; main.play().catch(function(){});
    thumbs.forEach(function(t,k){ t.classList.toggle("is-active",k===i); });
  }

  function build(){
    main=document.getElementById("ffrVidMain");
    var list=document.getElementById("ffrVidList");
    if(!main||!list) return;
    VIDS.forEach(function(f,i){
      var t=document.createElement("div"); t.className="ffr-vid__thumb";
      var v=document.createElement("video");
      v.src=B+f+"#t=0.3"; v.muted=true; v.playsInline=true; v.preload="metadata";
      var pl=document.createElement("span"); pl.className="ffr-vid__play";
      pl.innerHTML="<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/></svg>";
      t.appendChild(v); t.appendChild(pl);
      t.addEventListener("click",function(){ select(i); });
      list.appendChild(t); thumbs.push(t);
    });
    select(0);
  }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-vid-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("Aperte o Play")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
<!-- ===== FIM SEÇÃO VÍDEOS ===== -->
