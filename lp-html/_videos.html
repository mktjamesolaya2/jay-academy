<!-- ===== SEÇÃO VÍDEOS "NA PRÁTICA" — hover dá play (mobile: toca), sem texto sobre o vídeo ===== -->
<style>
.ffr-vid{position:relative;background:radial-gradient(130% 110% at 82% 18%,#16121d 0%,#0d0a12 52%,#070509 100%);font-family:'Poppins',system-ui,sans-serif;padding:74px 20px 84px;overflow:hidden;}
.ffr-vid::before{content:"";position:absolute;top:-120px;left:50%;transform:translateX(-50%);width:620px;height:320px;background:radial-gradient(closest-side,rgba(168,85,247,.16),transparent 70%);pointer-events:none;}
.ffr-vid__head{position:relative;text-align:center;max-width:680px;margin:0 auto 42px;}
.ffr-vid__eyebrow{display:inline-flex;align-items:center;gap:9px;color:#c084fc;font-size:12.5px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;margin:0 0 12px;}
.ffr-vid__eyebrow::before{content:"";width:30px;height:2px;background:linear-gradient(90deg,#f5a8e0,#a855f7);}
.ffr-vid__title{font-size:clamp(28px,4.4vw,50px);font-weight:800;line-height:1.05;letter-spacing:-.02em;margin:0;color:#fff;}
.ffr-vid__title b{background:linear-gradient(92deg,#f5a8e0,#c084fc 55%,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent;}
.ffr-vid__row{position:relative;display:flex;flex-wrap:wrap;gap:clamp(14px,1.8vw,22px);justify-content:center;max-width:1080px;margin:0 auto;}
.ffr-vid__card{position:relative;flex:0 0 auto;width:clamp(172px,21vw,236px);aspect-ratio:9/16;border-radius:16px;overflow:hidden;cursor:pointer;background:#15101e;box-shadow:0 20px 44px rgba(0,0,0,.5);transition:transform .35s cubic-bezier(.22,.61,.36,1),box-shadow .35s;}
.ffr-vid__card video{width:100%;height:100%;object-fit:cover;display:block;background:#000;}
.ffr-vid__play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.16);border:1.5px solid rgba(255,255,255,.85);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;z-index:2;transition:opacity .3s;pointer-events:none;}
.ffr-vid__play svg{width:20px;height:20px;fill:#fff;margin-left:2px;}
.ffr-vid__card.is-playing .ffr-vid__play{opacity:0;}
.ffr-vid__card:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 30px 60px rgba(168,85,247,.4),0 0 0 2px rgba(192,132,252,.6);z-index:3;}
@media(max-width:680px){
  .ffr-vid{padding:54px 14px 64px;}
  .ffr-vid__card{width:clamp(150px,44vw,200px);}
}
</style>
<div id="ffr-vid-wrap" style="display:none">
  <section class="ffr-vid">
    <div class="ffr-vid__head">
      <p class="ffr-vid__eyebrow">Na prática</p>
      <h2 class="ffr-vid__title">Veja a técnica <b>em movimento</b></h2>
    </div>
    <div class="ffr-vid__row" id="ffrVidRow"></div>
  </section>
</div>
<script>
(function(){
  var B="https://brbpjjqigpmxombzbxiu.supabase.co/storage/v1/object/public/media/wpmirror/";
  var VIDS=[
    "b10a39e931ec-snapinsta.app-118651566-3287498404622196-5607887651076890258-n-5edcd683af.mp4",
    "3267b48f325a-snapinsta.app-118708879-321346189118582-8314541208787868570-n-c20ef8b019.mp4",
    "bd101e4bfb63-snapinsta.app-118692842-349397012914962-2903286034012503326-n-704702c23d.mp4",
    "b5e8876d62b6-snapinsta.app-118701628-998662293981544-2590609756776100733-n-3e76fcb236.mp4"
  ];
  var mounted=false;

  function build(){
    var row=document.getElementById("ffrVidRow");
    if(!row) return;
    VIDS.forEach(function(f){
      var card=document.createElement("div"); card.className="ffr-vid__card";
      var v=document.createElement("video");
      v.src=B+f+"#t=0.3"; v.muted=true; v.loop=true; v.playsInline=true; v.preload="metadata";
      var pl=document.createElement("span"); pl.className="ffr-vid__play";
      pl.innerHTML="<svg viewBox=\"0 0 24 24\"><path d=\"M8 5v14l11-7z\"/></svg>";
      card.appendChild(v); card.appendChild(pl);

      function play(){ v.play().then(function(){card.classList.add("is-playing");}).catch(function(){}); }
      function stop(){ v.pause(); v.currentTime=0; card.classList.remove("is-playing"); }
      // desktop: passa o mouse dá play / sai pausa
      card.addEventListener("mouseenter",play);
      card.addEventListener("mouseleave",stop);
      // mobile/toque: toca pra dar play/pausar
      card.addEventListener("click",function(){ if(v.paused){play();}else{v.pause();card.classList.remove("is-playing");} });
      v.addEventListener("playing",function(){card.classList.add("is-playing");});
      v.addEventListener("pause",function(){card.classList.remove("is-playing");});

      row.appendChild(card);
    });
  }

  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-vid-wrap");
    if(!wrap) return;
    mounted=true;
    var old=null, secs=document.querySelectorAll(".elementor-section");
    for(var k=0;k<secs.length;k++){
      var s=secs[k];
      if(s.textContent && s.textContent.indexOf("Aperte o Play")!==-1){
        old=s.closest(".elementor-top-section")||s; break;
      }
    }
    if(old){ old.style.display="none"; old.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
    build();
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,600);
})();
</script>
<!-- ===== FIM SEÇÃO VÍDEOS ===== -->
