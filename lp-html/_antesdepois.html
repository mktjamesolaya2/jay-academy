<!-- ===== SEÇÃO ANTES/DEPOIS — imagens completas, limpo (continuação dos depoimentos) ===== -->
<style>
.ffr-ad{position:relative;font-family:'Poppins',system-ui,sans-serif;overflow:hidden;
  padding:0 20px clamp(60px,8vw,96px);
  background:linear-gradient(180deg,#14101e 0%,#0b0813 60%,#08060e 100%);}
.ffr-ad__grid{position:relative;z-index:1;max-width:1040px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(20px,2.6vw,34px);}
.ffr-ad__item{position:relative;border-radius:10px;overflow:hidden;box-shadow:0 18px 44px rgba(0,0,0,.45);}
.ffr-ad__item img{display:block;width:100%;height:auto;}
@media(max-width:680px){ .ffr-ad__grid{grid-template-columns:1fr;gap:22px;max-width:420px;} }
</style>
<div id="ffr-ad-wrap" style="display:none">
  <section class="ffr-ad">
    <div class="ffr-ad__grid">
      <div class="ffr-ad__item"><img src="/lp/fio-a-fio-realista/antesdepois-1.webp" alt="Antes e depois do curso" loading="lazy"></div>
      <div class="ffr-ad__item"><img src="/lp/fio-a-fio-realista/antesdepois-2.webp" alt="Antes e depois do curso" loading="lazy"></div>
    </div>
  </section>
</div>
<script>
(function(){
  var mounted=false;
  function mount(){
    if(mounted) return;
    var wrap=document.getElementById("ffr-ad-wrap");
    if(!wrap) return;
    mounted=true;
    var dep=document.getElementById("ffr-dep-wrap");
    if(dep && dep.parentNode){ dep.insertAdjacentElement("afterend",wrap); }
    wrap.style.display="block";
  }
  if(document.readyState==="loading"){ document.addEventListener("DOMContentLoaded",mount); }
  else{ mount(); }
  setTimeout(mount,800);
})();
</script>
<!-- ===== FIM SEÇÃO ANTES/DEPOIS ===== -->
